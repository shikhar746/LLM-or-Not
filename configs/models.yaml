# One block per method. `grid` values are tried on the validation split; the best by validation
# macro-F1 is refit on train + validation and then scored on test (see DECISIONS.md D10).

majority: {}

tfidf_lr:
  grid:
    C: [1, 3, 10, 30, 100]

embed_lr:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  device: null            # null = GPU if PyTorch can see one, else CPU
  grid:
    C: [1, 3, 10, 30, 100, 300]

llm_zeroshot:
  host: http://localhost:11434
  # "auto" = the best (model, prompt) row in results/llm_tuning.csv, written by scripts/tune_llm.py
  model: auto
  prompt: auto
  candidate_models: [qwen2.5:3b, llama3.2:3b, gemma2:2b, phi3.5]   # only those installed are tried
  candidate_prompts: [zeroshot_names, zeroshot_descriptions]
  tuning_per_class: 3     # validation items per intent used for tuning (77 x 3 = 231)
  options:
    temperature: 0        # always pick the most likely token -> repeatable answers
    seed: 42
    num_ctx: 4096         # context window; Ollama's default can silently truncate our ~2-3k-token prompt
    num_predict: 32       # max output tokens; a label in JSON needs < 20
  keep_alive: 30m         # keep the model in GPU memory between calls
  cache_dir: llm_cache
